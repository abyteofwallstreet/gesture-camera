[package]
name = "note-capturer-desktop"
version = "0.2.0"
description = "Local gesture camera with full-resolution photo capture"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[profile.release]
strip = true
lto = "thin"

[features]
custom-protocol = ["tauri/custom-protocol"]
